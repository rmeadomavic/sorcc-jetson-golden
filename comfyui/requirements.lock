# Python packages for the ComfyUI image, pinned for Python 3.10 on aarch64 (Jetson).
# Resolved from ComfyUI v0.19.3 requirements.txt with numpy<2, as published on PyPI
# on 2026-07-15 (the build the class kits were accepted on). torch, torchvision, and
# torchaudio are deliberately absent: the base image already carries the Jetson CUDA
# builds, and a PyPI copy would silently replace them with CPU-only wheels.
#
# Regenerate (only when moving to a new ComfyUI version):
#   uv pip compile ComfyUI/requirements.txt -c pins.txt --python-version 3.10 \
#     --python-platform aarch64-unknown-linux-gnu --exclude-newer <date> --no-header --no-annotate
#   where pins.txt holds: torch==2.7.0 torchvision==0.22.0 torchaudio==2.7.0 numpy<2
# then delete the torch, torchvision, and torchaudio lines.
